apiVersion: ocular.crashoverride.run/v1beta1
kind: ClusterUploader
metadata:
  name: webhook
spec:
  container:
    command:
    - /entrypoint
    image: uploaders
    imagePullPolicy: IfNotPresent
    name: webhook
    resources: {}
  parameters:
  - description: URL of the webhook to send data to.
    name: URL
  - default: PUT
    description: The HTTP method to use for the webhook request. Defaults to PUT.
    name: METHOD
